# Security updates are immediate and ungrouped (Dependabot's security updates
# ignore `schedule` and `groups` for the security PR). They also honour
# `ignore`, so no ecosystem here ignores `version-update:semver-major`: that
# entry would silence a security fix that crosses a major. Majors therefore
# arrive as pull requests. A major PR is a signal and is never merged as
# opened: the PR itself is the migration note the supply-chain policy asks
# for ("majors: issue with migration note"), and the migration lands as its
# own reviewed change.
version: 2
updates:
  # There is no npm entry. This package has no dependencies by design
  # (docs/adr/0001) and no lockfile, so an npm ecosystem here would have
  # nothing to open a PR about. Add it with the first dependency.
  #
  # Every `uses:` in this repository is pinned to a full commit SHA with the
  # readable version in a trailing comment, per kodera-core
  # `docs/security/SUPPLY_CHAIN_POLICY.md` sections 6 and 8: a workflow is
  # the one dependency that runs with repository credentials, and a tag can
  # be moved under it. That format is the configuration -- dependabot has no
  # 'prefer SHA' switch, it follows whatever the workflow already carries,
  # and it rewrites the SHA and the trailing comment together when it bumps.
  # Reverting a `uses:` to a bare tag silently opts that action out of
  # pinning, so a pull request that does it is a reject, not a nit.
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # One PR rather than one per action: ungrouped, these arrive as a handful
    # of single-line bumps a week, get rubber-stamped, and the one that matters
    # is lost in the pile.
    groups:
      actions:
        # Capped on purpose. `patterns: ['*']` with no `update-types` collects
        # majors into the weekly bundle: a sibling repository's actions group
        # arrived as a single pull request carrying three actions across six
        # major steps, under a header promising that a major is never merged as
        # opened. The configuration was manufacturing the thing it forbids.
        #
        # A cap is not an `ignore`. Dependabot still opens the major; it opens
        # it on its own, outside the group, which is the signal this file asks
        # for. Measured in this organisation: a capped npm group still produced
        # its major as an individual pull request rather than suppressing it.
        patterns: ['*']
        update-types: ['minor', 'patch']

# NOT covered by anything above: the gitleaks and actionlint versions in
# .github/workflows/ci.yml. They are pinned as env vars and downloaded as
# binaries — because both vendors' ACTIONS are licence-restricted for
# organisations — so dependabot cannot see them. They are bumped by hand, and
# a stale scanner is a scanner that misses the newest secret formats. The
# SHA-256 recorded next to each version in ci.yml must be bumped along with
# it, not left pointing at the old release.
